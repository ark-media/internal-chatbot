name: Ingest tests

on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - ".github/workflows/ingest-tests.yml"
  pull_request:
    paths:
      - "ingest/**"
      - ".github/workflows/ingest-tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ingest unit tests
        working-directory: ingest
        run: python -m unittest discover -s tests -v
