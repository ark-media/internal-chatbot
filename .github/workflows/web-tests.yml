name: Web tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned because package.json has no "packageManager" field; without one
      # the action errors with "No pnpm version is specified".
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm vitest run

      # lib/db.ts throws at module evaluation when DATABASE_URL is absent, which
      # fails page-data collection for every route. The build never opens a
      # connection, so a well-formed placeholder is all this needs.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost/db

      # Scoped to --prod deliberately. The production tree is clean and must
      # stay that way; the dev tree still carries one high advisory that only
      # clears with eslint 10, which breaks the eslint-plugin-react bundled by
      # eslint-config-next. Widen this once that upgrade lands.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
