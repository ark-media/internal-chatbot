[project]
name = "ark-ingest"
version = "0.1.0"
description = "Transcript ingestion for the Ark internal chatbot"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "voyageai>=0.3",
    "python-dotenv>=1.0",
]

[tool.setuptools]
py-modules = [
    "bootstrap",
    "chunker",
    "embed",
    "main",
    "normalize",
    "parse",
    "pending",
    "review",
    "upsert",
]
